# A structured explore: filled step by step with the structured-explore skill, built by `structured-explore build`.
title: <title>
phenomenon: >-
  <one sentence pointing at the data or the thing seen>
# Where the page's Home link goes.
home: /

sample_space:
  outcome: <what one row is, as a thing in the world>
  source: <table, relative to the data root, e.g. datasets/x/x.parquet; or a SQL query making one row per outcome>
  where: <sql picking the rows that are outcomes>
  entry: >-
    <how a row gets in, what is dropped>
  time: <column ordering outcomes in time, a UTC timestamp>
  timezone: UTC
  # Every variable is a column of Ω and a node of the graph. A derived one has an expr over the source's row.
  variables:
    - name: <column>
      meaning: <what it is, with its unit>
      observed: measured
    # - name: hour
    #   meaning: hour of day
    #   observed: derived
    #   expr: hour(<time column>)

# joins:
#   - name: <alias>
#     source: <table>
#     where: <sql>
#     key: <column joined on>
#     closes: <the gap step 3 named>
#     variables:
#       - {name: <column>, alias: <name in Ω>, meaning: <...>}

# The arrows between the variables, cause -> effect. A pair with no arrow is a claim of independence, which the
# page tests.
graph:
  edges:
    - <variable> -> <variable>
  notes: >-
    <what the arrows rest on, what is a root, what the graph leaves out>

# An event is its where clause; a question names it by that clause.
events:
  - where: <sql boolean over Ω's columns>
    meaning: <in words>
    defined: before

questions:
  - kind: marginal
    event: <where>
    guess: [<lo>, <hi>]
  # - kind: conditional
  #   event: <where>
  #   given: <where>
  #   guess: [<lo>, <hi>]
  #   lineup: true

null: shuffle
checks: [split_half]
